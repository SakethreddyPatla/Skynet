version: 2

models:
  - name: stg_flights
    description: "Silver Layer: Cleaned and validated flight telemetry state vectors."
    columns:
      - name: icao24
        description: "Unique 24-bit ICAO aircraft transponder address."
        tests:
          - not_null
      - name: latitude
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null

  - name: fct_country_kpis
    description: "Gold Layer: Incremental hourly flight telemetry KPIs aggregated by country."
    columns:
      - name: kpi_surrogate_key
        description: "Primary key: MD5 hash of batch_window_utc + origin_country + on_ground."
        tests:
          - not_null
          - unique
      - name: total_active_aircraft
        tests:
          - not_null